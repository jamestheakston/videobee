<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoBee - Group Video Calling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Landing Screen */
        .screen {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        /* Lobby Screen */
        .lobby-screen {
            max-width: 580px;
        }

        .room-code {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .room-code h2 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 8px;
            letter-spacing: 8px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        .room-code p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .copy-link {
            display: flex;
            gap: 12px;
        }

        .copy-link input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .copy-link input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .copy-link button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .copy-link button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .participants-list {
            margin-top: 24px;
        }

        .participants-list h3 {
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .participant-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .participant-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .participant-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            margin-right: 14px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .participant-name {
            flex: 1;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        .participant-status {
            color: #22c55e;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Call Screen */
        .call-screen {
            max-width: 100%;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            margin: 0;
        }

        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            color: white;
            padding: 0 8px;
        }

        .call-info h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .call-info p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
        }

        .call-status {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
            min-height: 400px;
        }

        .video-grid.one {
            grid-template-columns: 1fr;
            max-width: 900px;
            margin: 0 auto 24px;
        }

        .video-grid.one .video-tile {
            aspect-ratio: 16/9;
        }

        .video-grid.two {
            grid-template-columns: repeat(2, 1fr);
        }

        .video-grid.three,
        .video-grid.four {
            grid-template-columns: repeat(2, 1fr);
        }

        .video-grid.five,
        .video-grid.six {
            grid-template-columns: repeat(3, 1fr);
        }

        .video-tile {
            position: relative;
            background: rgba(42, 42, 74, 0.8);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .video-tile:hover {
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.2);
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tile.local {
            border: 3px solid #667eea;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        .video-tile .participant-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-tile .connection-status {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-tile .connection-status.connecting {
            background: rgba(234, 179, 8, 0.9);
            border-color: rgba(234, 179, 8, 0.3);
        }

        .video-tile .connection-status.connected {
            background: rgba(34, 197, 94, 0.9);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .video-tile .connection-status.failed {
            background: rgba(239, 68, 68, 0.9);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .control-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.mute {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn.mute.active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .control-btn.camera {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn.camera.active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .control-btn.leave {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .control-btn.leave:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(239, 68, 68, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .screen {
                padding: 32px 24px;
                margin: 16px;
                border-radius: 20px;
            }

            .logo h1 {
                font-size: 2.2rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .video-grid.two {
                grid-template-columns: 1fr;
            }

            .video-grid.three,
            .video-grid.four {
                grid-template-columns: 1fr;
            }

            .video-grid.five,
            .video-grid.six {
                grid-template-columns: 1fr;
            }

            .controls {
                padding: 20px;
                gap: 16px;
            }

            .control-btn {
                width: 56px;
                height: 56px;
                font-size: 1.4rem;
            }

            .call-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .call-info h2 {
                font-size: 1.4rem;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Landing Screen -->
        <div id="landing-screen" class="screen active">
            <div class="logo">
                <h1>🐝 VideoBee</h1>
                <p>Simple group video calling</p>
            </div>
            <div class="form-group">
                <label for="display-name">Your Name</label>
                <input type="text" id="display-name" placeholder="Enter your name" maxlength="30">
            </div>
            <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
            <button class="btn btn-secondary" onclick="showJoinScreen()">Join Room</button>
            <div id="join-room-form" class="form-group" style="display: none;">
                <label for="room-code">Room Code</label>
                <input type="text" id="room-code" placeholder="Enter 6-character code" maxlength="6" style="text-transform: uppercase;">
                <button class="btn btn-primary" onclick="joinRoom()" style="margin-top: 10px;">Join</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen lobby-screen">
            <div class="logo">
                <h1>🐝 VideoBee</h1>
            </div>
            <div class="room-code">
                <h2 id="lobby-room-code">------</h2>
                <p>Share this code with others</p>
                <div class="copy-link">
                    <input type="text" id="share-link" readonly>
                    <button onclick="copyLink()">Copy</button>
                </div>
            </div>
            <div class="participants-list">
                <h3>Participants (<span id="participant-count">0</span>)</h3>
                <div id="participants-container"></div>
            </div>
            <button class="btn btn-primary" onclick="startCall()">Start Call</button>
            <button class="btn btn-secondary" onclick="leaveRoom()">Leave Room</button>
        </div>

        <!-- Call Screen -->
        <div id="call-screen" class="screen call-screen">
            <div class="call-header">
                <div class="call-info">
                    <h2>🐝 VideoBee</h2>
                    <p>Room: <span id="call-room-code">------</span></p>
                </div>
                <div class="call-status">
                    <span id="call-participant-count">0 participants</span>
                </div>
            </div>
            <div class="video-grid" id="video-grid"></div>
            <div class="controls">
                <button class="control-btn mute" id="mute-btn" onclick="toggleMute()">🎤</button>
                <button class="control-btn camera" id="camera-btn" onclick="toggleCamera()">📷</button>
                <button class="control-btn leave" onclick="leaveCall()">📞</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        
        // TODO: Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'https://vgnqzbutcrpospdaoiwb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__LInDJPMKS10Ufa5SQYsPg_Lw5FvLbH';
        
        // Initialize Supabase client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // STUN server configuration
        // For production, you should add TURN servers here as well
        // Mesh connections need TURN more often since every pairwise connection must succeed
        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
                // Add TURN servers for production:
                // { urls: 'turn:your-turn-server.com:3478', username: 'username', credential: 'password' }
            ]
        };

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        
        let state = {
            displayName: '',
            clientId: '',
            roomCode: '',
            localStream: null,
            peerConnections: {}, // Map of clientId -> RTCPeerConnection
            remoteStreams: {}, // Map of clientId -> MediaStream
            isMuted: false,
            isCameraOff: false,
            channel: null, // Supabase Realtime channel
            participants: [], // Array of participant info from Presence
            inCall: false
        };

        // ============================================
        // IDENTITY MANAGEMENT
        // ============================================
        
        function initializeIdentity() {
            // Load or create display name
            const savedName = localStorage.getItem('videobee_display_name');
            if (savedName) {
                document.getElementById('display-name').value = savedName;
                state.displayName = savedName;
            }

            // Load or create client ID
            let savedId = localStorage.getItem('videobee_client_id');
            if (!savedId) {
                savedId = crypto.randomUUID();
                localStorage.setItem('videobee_client_id', savedId);
            }
            state.clientId = savedId;
        }

        function saveDisplayName() {
            const nameInput = document.getElementById('display-name');
            const name = nameInput.value.trim();
            if (name) {
                state.displayName = name;
                localStorage.setItem('videobee_display_name', name);
            }
        }

        // ============================================
        // UI MANAGEMENT
        // ============================================
        
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showJoinScreen() {
            document.getElementById('join-room-form').style.display = 'block';
        }

        // ============================================
        // ROOM MANAGEMENT
        // ============================================
        
        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function createRoom() {
            saveDisplayName();
            if (!state.displayName) {
                showToast('Please enter your name');
                return;
            }

            const roomCode = generateRoomCode();
            state.roomCode = roomCode;

            // Optional: Create room record in database
            try {
                await supabaseClient.from('rooms').insert({
                    room_code: roomCode,
                    active: true
                });
            } catch (error) {
                console.log('Room creation optional, continuing:', error);
            }

            await joinRoomChannel();
            showLobby();
        }

        async function joinRoom() {
            saveDisplayName();
            const roomCodeInput = document.getElementById('room-code');
            const roomCode = roomCodeInput.value.trim().toUpperCase();

            if (!state.displayName) {
                showToast('Please enter your name');
                return;
            }

            if (roomCode.length !== 6) {
                showToast('Please enter a valid 6-character room code');
                return;
            }

            state.roomCode = roomCode;
            await joinRoomChannel();
            showLobby();
        }

        async function joinRoomChannel() {
            const channelName = `room:${state.roomCode}`;
            
            state.channel = supabaseClient.channel(channelName, {
                config: {
                    presence: {
                        key: state.clientId
                    }
                }
            });

            // Handle presence events (must be set up before subscribe)
            state.channel.on('presence', { event: 'sync' }, () => {
                handlePresenceSync();
            });

            state.channel.on('presence', { event: 'join' }, ({ key, newPresences }) => {
                handleParticipantJoin(newPresences[0]);
            });

            state.channel.on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                handleParticipantLeave(leftPresences[0]);
            });

            // Handle WebRTC signaling messages (must be set up before subscribe)
            state.channel.on('broadcast', { event: 'webrtc-signal' }, ({ payload }) => {
                handleWebRTCSignal(payload);
            });

            // Set up presence state and subscribe
            await state.channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    // Track our presence
                    await state.channel.track({
                        display_name: state.displayName,
                        client_id: state.clientId,
                        online_at: new Date().toISOString()
                    });
                }
            });
        }

        function handlePresenceSync() {
            const presenceState = state.channel.presenceState();
            state.participants = [];
            
            Object.keys(presenceState).forEach(clientId => {
                presenceState[clientId].forEach(presence => {
                    if (presence.client_id !== state.clientId) {
                        state.participants.push(presence);
                    }
                });
            });

            updateParticipantsList();
        }

        function handleParticipantJoin(presence) {
            if (presence.client_id === state.clientId) return;
            
            console.log('Participant joined:', presence.display_name);
            
            if (!state.participants.find(p => p.client_id === presence.client_id)) {
                state.participants.push(presence);
                updateParticipantsList();

                // If we're in a call, initiate connection with new participant
                if (state.inCall) {
                    initiatePeerConnection(presence.client_id);
                }
            }
        }

        function handleParticipantLeave(presence) {
            console.log('Participant left:', presence.display_name);
            
            state.participants = state.participants.filter(p => p.client_id !== presence.client_id);
            updateParticipantsList();

            // Clean up peer connection
            if (state.peerConnections[presence.client_id]) {
                state.peerConnections[presence.client_id].close();
                delete state.peerConnections[presence.client_id];
            }

            // Remove remote stream
            if (state.remoteStreams[presence.client_id]) {
                delete state.remoteStreams[presence.client_id];
            }

            // Remove video tile
            removeVideoTile(presence.client_id);
        }

        function updateParticipantsList() {
            const container = document.getElementById('participants-container');
            const countSpan = document.getElementById('participant-count');
            
            countSpan.textContent = state.participants.length + 1; // +1 for self
            
            container.innerHTML = state.participants.map(p => `
                <div class="participant-item">
                    <div class="participant-avatar">
                        ${p.display_name.charAt(0).toUpperCase()}
                    </div>
                    <div class="participant-name">${p.display_name}</div>
                    <div class="participant-status">Online</div>
                </div>
            `).join('');

            // Update call participant count if in call
            if (state.inCall) {
                document.getElementById('call-participant-count').textContent = 
                    `${state.participants.length + 1} participants`;
            }
        }

        function showLobby() {
            document.getElementById('lobby-room-code').textContent = state.roomCode;
            const shareLink = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
            document.getElementById('share-link').value = shareLink;
            showScreen('lobby-screen');
        }

        function copyLink() {
            const linkInput = document.getElementById('share-link');
            linkInput.select();
            document.execCommand('copy');
            showToast('Link copied to clipboard');
        }

        async function leaveRoom() {
            // Leave the channel
            if (state.channel) {
                await state.channel.untrack();
                await supabaseClient.removeChannel(state.channel);
                state.channel = null;
            }

            // Clean up peer connections
            Object.keys(state.peerConnections).forEach(clientId => {
                state.peerConnections[clientId].close();
            });
            state.peerConnections = {};
            state.remoteStreams = {};

            // Stop local stream
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => track.stop());
                state.localStream = null;
            }

            state.roomCode = '';
            state.participants = [];
            state.inCall = false;

            showScreen('landing-screen');
        }

        // ============================================
        // WEBRTC MESH SIGNALING
        // ============================================
        
        function sendSignal(targetClientId, type, data) {
            if (!state.channel) return;

            state.channel.send({
                type: 'broadcast',
                event: 'webrtc-signal',
                payload: {
                    sender_id: state.clientId,
                    target_id: targetClientId,
                    type: type,
                    data: data
                }
            });
        }

        function handleWebRTCSignal(payload) {
            const { sender_id, target_id, type, data } = payload;

            // Only process messages meant for us
            if (target_id !== state.clientId) return;

            console.log('Received signal:', type, 'from', sender_id);

            switch (type) {
                case 'offer':
                    handleOffer(sender_id, data);
                    break;
                case 'answer':
                    handleAnswer(sender_id, data);
                    break;
                case 'ice-candidate':
                    handleIceCandidate(sender_id, data);
                    break;
            }
        }

        // ============================================
        // PEER CONNECTION MANAGEMENT
        // ============================================
        
        function createPeerConnection(remoteClientId) {
            const pc = new RTCPeerConnection(iceServers);

            // Add local stream tracks
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => {
                    pc.addTrack(track, state.localStream);
                });
            }

            // Handle remote stream
            pc.ontrack = (event) => {
                console.log('Received remote track from', remoteClientId);
                if (event.streams && event.streams[0]) {
                    state.remoteStreams[remoteClientId] = event.streams[0];
                    addVideoTile(remoteClientId, event.streams[0]);
                }
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal(remoteClientId, 'ice-candidate', event.candidate);
                }
            };

            // Handle connection state changes
            pc.onconnectionstatechange = () => {
                console.log('Connection state with', remoteClientId, ':', pc.connectionState);
                updateConnectionStatus(remoteClientId, pc.connectionState);
            };

            // Handle ICE connection state changes
            pc.oniceconnectionstatechange = () => {
                console.log('ICE connection state with', remoteClientId, ':', pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                    updateConnectionStatus(remoteClientId, 'failed');
                }
            };

            state.peerConnections[remoteClientId] = pc;
            return pc;
        }

        function initiatePeerConnection(remoteClientId) {
            console.log('Initiating connection to', remoteClientId);
            
            const pc = createPeerConnection(remoteClientId);
            
            // Create and send offer
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    sendSignal(remoteClientId, 'offer', pc.localDescription);
                })
                .catch(error => {
                    console.error('Error creating offer:', error);
                });
        }

        function handleOffer(remoteClientId, offer) {
            console.log('Handling offer from', remoteClientId);
            
            let pc = state.peerConnections[remoteClientId];
            
            // If connection doesn't exist, create it
            if (!pc) {
                pc = createPeerConnection(remoteClientId);
            }

            pc.setRemoteDescription(new RTCSessionDescription(offer))
                .then(() => pc.createAnswer())
                .then(answer => pc.setLocalDescription(answer))
                .then(() => {
                    sendSignal(remoteClientId, 'answer', pc.localDescription);
                })
                .catch(error => {
                    console.error('Error handling offer:', error);
                });
        }

        function handleAnswer(remoteClientId, answer) {
            console.log('Handling answer from', remoteClientId);
            
            const pc = state.peerConnections[remoteClientId];
            if (!pc) {
                console.error('No peer connection found for', remoteClientId);
                return;
            }

            pc.setRemoteDescription(new RTCSessionDescription(answer))
                .catch(error => {
                    console.error('Error handling answer:', error);
                });
        }

        function handleIceCandidate(remoteClientId, candidate) {
            console.log('Handling ICE candidate from', remoteClientId);
            
            const pc = state.peerConnections[remoteClientId];
            if (!pc) {
                console.error('No peer connection found for', remoteClientId);
                return;
            }

            pc.addIceCandidate(new RTCIceCandidate(candidate))
                .catch(error => {
                    console.error('Error adding ICE candidate:', error);
                });
        }

        // ============================================
        // MEDIA MANAGEMENT
        // ============================================
        
        async function getLocalMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                state.localStream = stream;
                return stream;
            } catch (error) {
                console.error('Error getting media:', error);
                showToast('Could not access camera/microphone');
                throw error;
            }
        }

        function toggleMute() {
            if (!state.localStream) return;
            
            state.isMuted = !state.isMuted;
            state.localStream.getAudioTracks().forEach(track => {
                track.enabled = !state.isMuted;
            });

            const btn = document.getElementById('mute-btn');
            btn.classList.toggle('active', state.isMuted);
            btn.textContent = state.isMuted ? '🔇' : '🎤';
        }

        function toggleCamera() {
            if (!state.localStream) return;
            
            state.isCameraOff = !state.isCameraOff;
            state.localStream.getVideoTracks().forEach(track => {
                track.enabled = !state.isCameraOff;
            });

            const btn = document.getElementById('camera-btn');
            btn.classList.toggle('active', state.isCameraOff);
            btn.textContent = state.isCameraOff ? '📷' : '📹';

            // Update local video tile
            const localVideo = document.querySelector('.video-tile.local video');
            if (localVideo) {
                localVideo.style.opacity = state.isCameraOff ? '0' : '1';
            }
        }

        // ============================================
        // VIDEO GRID MANAGEMENT
        // ============================================
        
        function addVideoTile(clientId, stream, isLocal = false) {
            const grid = document.getElementById('video-grid');
            
            // Check if tile already exists
            if (document.getElementById(`video-${clientId}`)) {
                return;
            }

            const participant = isLocal 
                ? { display_name: state.displayName }
                : state.participants.find(p => p.client_id === clientId) || { display_name: 'Unknown' };

            const tile = document.createElement('div');
            tile.className = `video-tile ${isLocal ? 'local' : ''}`;
            tile.id = `video-${clientId}`;

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            video.srcObject = stream;
            if (isLocal && state.isCameraOff) {
                video.style.opacity = '0';
            }
            video.muted = isLocal; // Mute local video to prevent feedback

            const label = document.createElement('div');
            label.className = 'participant-label';
            label.textContent = participant.display_name + (isLocal ? ' (You)' : '');

            const status = document.createElement('div');
            status.className = 'connection-status connecting';
            status.id = `status-${clientId}`;
            status.textContent = 'Connecting...';

            tile.appendChild(video);
            tile.appendChild(label);
            tile.appendChild(status);
            grid.appendChild(tile);

            updateGridLayout();
        }

        function removeVideoTile(clientId) {
            const tile = document.getElementById(`video-${clientId}`);
            if (tile) {
                tile.remove();
                updateGridLayout();
            }
        }

        function updateConnectionStatus(clientId, status) {
            const statusEl = document.getElementById(`status-${clientId}`);
            if (statusEl) {
                statusEl.className = 'connection-status ' + status;
                statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            }
        }

        function updateGridLayout() {
            const grid = document.getElementById('video-grid');
            const tileCount = grid.children.length;
            
            grid.className = 'video-grid';
            
            if (tileCount === 1) grid.classList.add('one');
            else if (tileCount === 2) grid.classList.add('two');
            else if (tileCount === 3 || tileCount === 4) grid.classList.add('three');
            else if (tileCount === 5 || tileCount === 6) grid.classList.add('five');
        }

        // ============================================
        // CALL MANAGEMENT
        // ============================================
        
        async function startCall() {
            try {
                // Get local media
                await getLocalMedia();
                
                state.inCall = true;
                showScreen('call-screen');
                document.getElementById('call-room-code').textContent = state.roomCode;

                // Add local video tile
                addVideoTile(state.clientId, state.localStream, true);

                // Initiate connections with all existing participants
                state.participants.forEach(participant => {
                    initiatePeerConnection(participant.client_id);
                });

                updateParticipantsList();

            } catch (error) {
                console.error('Error starting call:', error);
                showToast('Failed to start call');
            }
        }

        function leaveCall() {
            // Stop local stream
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => track.stop());
                state.localStream = null;
            }

            // Close all peer connections
            Object.keys(state.peerConnections).forEach(clientId => {
                state.peerConnections[clientId].close();
            });
            state.peerConnections = {};
            state.remoteStreams = {};

            // Clear video grid
            document.getElementById('video-grid').innerHTML = '';

            state.inCall = false;
            state.isMuted = false;
            state.isCameraOff = false;

            // Reset control buttons
            document.getElementById('mute-btn').classList.remove('active');
            document.getElementById('mute-btn').textContent = '🎤';
            document.getElementById('camera-btn').classList.remove('active');
            document.getElementById('camera-btn').textContent = '📷';

            showLobby();
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            
            if (roomParam && roomParam.length === 6) {
                document.getElementById('room-code').value = roomParam;
                showJoinScreen();
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initializeIdentity();
            checkUrlParams();
        });

        /*
         * NOTE ON MESH WEBRTC SCALABILITY:
         * 
         * Full mesh WebRTC architecture gets CPU and bandwidth-heavy beyond ~6-8 participants per person.
         * This is because each participant uploads their stream N-1 times (once to each other participant).
         * 
         * For example, in a 6-person call:
         * - Each person maintains 5 peer connections
         * - Each person uploads their stream 5 times
         * - Total connections in the room: 6 × 5 = 30
         * 
         * For production-grade group video calling with many participants, you would need an SFU
         * (Selective Forwarding Unit) such as:
         * - LiveKit (https://livekit.io)
         * - mediasoup (https://mediasoup.org)
         * - Daily (https://www.daily.co)
         * 
         * An SFU receives each stream once and forwards it to all other participants,
         * dramatically reducing the upload bandwidth requirement for each client.
         * 
         * However, for small groups (2-6 people), mesh architecture is perfectly fine and
         * is the simplest approach without requiring additional media server infrastructure.
         */
    </script>
</body>
</html>
